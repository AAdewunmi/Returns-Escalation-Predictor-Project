<!-- path: templates/ops/partials/_note_form.html -->
<form
  method="post"
  action="{% url 'ops:add-note' case.pk %}"
  hx-post="{% url 'ops:add-note' case.pk %}"
  hx-target="#notes-panel"
  hx-swap="outerHTML"
  class="mb-4"
>
  {% csrf_token %}
  <label class="form-label" for="{{ note_form.body.id_for_label }}">Add note</label>
  {{ note_form.body }}
  {% for error in note_form.body.errors %}
    <div class="invalid-feedback d-block">{{ error }}</div>
  {% endfor %}

  <div class="mt-3">
    <button type="submit" class="btn btn-primary">Save internal note</button>
  </div>
</form>
