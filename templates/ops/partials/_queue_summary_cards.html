<!-- path: templates/ops/partials/_queue_summary_cards.html -->
<div class="row g-3 mb-4">
  {% for card in summary_cards %}
    <div class="col-12 col-md-6 col-xl-3">
      <article class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <p class="text-muted text-uppercase small fw-semibold mb-2">{{ card.label }}</p>
          <p class="display-6 mb-0">{{ card.value }}</p>
        </div>
      </article>
    </div>
  {% endfor %}
</div>
