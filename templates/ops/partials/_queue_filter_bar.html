<!-- path: templates/ops/partials/_queue_filter_bar.html -->
<form
  class="row g-3 align-items-end mb-4"
  method="get"
  action="{% url 'ops:queue' %}"
  hx-get="{% url 'ops:queue' %}"
  hx-target="#ops-queue-table"
  hx-push-url="true"
>
  <div class="col-12 col-lg-4">
    <label class="form-label" for="queue-search">Search</label>
    <input
      id="queue-search"
      type="text"
      name="search"
      class="form-control"
      value="{{ filters.search|default:'' }}"
      placeholder="Reference, customer, merchant, or return reason"
    >
  </div>

  <div class="col-6 col-lg-3">
    <label class="form-label" for="queue-status">Status</label>
    <select id="queue-status" name="status" class="form-select">
      <option value="">All statuses</option>
      {% for value, label in status_options %}
        <option value="{{ value }}" {% if filters.status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-6 col-lg-3">
    <label class="form-label" for="queue-priority">Priority</label>
    <select id="queue-priority" name="priority" class="form-select">
      <option value="">All priorities</option>
      {% for value, label in priority_options %}
        <option value="{{ value }}" {% if filters.priority == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-12 col-lg-2 d-grid">
    <button type="submit" class="btn btn-primary">Apply filters</button>
  </div>
</form>
