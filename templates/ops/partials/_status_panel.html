<!-- path: templates/ops/partials/_status_panel.html -->
<section class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
      <div>
        <h2 class="h5 mb-1">Workflow state</h2>
        <p class="text-muted mb-0">Read-only today. Interactive workflow controls arrive on Wednesday.</p>
      </div>
    </div>

    <dl class="row mb-0">
      <dt class="col-sm-3 text-muted">Status</dt>
      <dd class="col-sm-9">{{ case.get_status_display }}</dd>

      <dt class="col-sm-3 text-muted">Priority</dt>
      <dd class="col-sm-9">{{ case.get_priority_display }}</dd>

      <dt class="col-sm-3 text-muted">Customer</dt>
      <dd class="col-sm-9">{{ case.customer.user.email }}</dd>

      <dt class="col-sm-3 text-muted">Merchant</dt>
      <dd class="col-sm-9">{{ case.merchant.name }}</dd>
    </dl>
  </div>
</section>
