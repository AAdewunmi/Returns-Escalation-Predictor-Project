# path: .github/workflows/ci.yml
name: CI

on:
  create:
  push:
  pull_request:

jobs:
  branch-create-debug:
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Log created branch
        run: echo "Created branch ${{ github.event.ref }} from ${{ github.repository }}"

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: returnhub
          POSTGRES_USER: returnhub
          POSTGRES_PASSWORD: returnhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U returnhub -d returnhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key
      RELEASE_VERSION: ci
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: returnhub
      POSTGRES_USER: returnhub
      POSTGRES_PASSWORD: returnhub
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Run tests with coverage
        run: pytest -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
